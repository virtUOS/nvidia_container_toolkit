---
nvidia_container_toolkit_repo_url: "https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo"
nvidia_docker_default_runtime: "nvidia"
# Keep containers running while dockerd restarts, e.g. when dnf upgrades
# docker-ce (patch releases only, per the Docker docs). Off by default so
# existing hosts render the same daemon.json as before.
nvidia_docker_live_restore: false
